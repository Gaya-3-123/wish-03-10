<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Vikram 🎂</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: radial-gradient(circle at top, #18245c, #050817 65%, #000);
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
}

/* 🌙 Moon */
.moon {
    position: fixed;
    top: 7%;
    right: 10%;
    width: 90px;
    height: 90px;
    background: #fff7c7;
    border-radius: 50%;
    box-shadow: 0 0 35px #fff4a8;
    z-index: 2;
}

.moon::after {
    content: "";
    position: absolute;
    top: -8px;
    left: 25px;
    width: 90px;
    height: 90px;
    background: #080b20;
    border-radius: 50%;
}

/* ⭐ Stars */
.star {
    position: fixed;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 8px white;
    animation: twinkle 1.5s infinite alternate;
}

@keyframes twinkle {
    from {
        opacity: 0.2;
        transform: scale(0.6);
    }
    to {
        opacity: 1;
        transform: scale(1.5);
    }
}

/* Main */
.container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
    z-index: 5;
}

/* Countdown */
.countdown {
    font-size: 90px;
    font-weight: bold;
    text-shadow: 0 0 25px #fff;
    animation: countdownPop 1s ease;
}

@keyframes countdownPop {
    0% {
        transform: scale(0);
        opacity: 0;
    }

    60% {
        transform: scale(1.3);
        opacity: 1;
    }

    100% {
        transform: scale(1);
    }
}

/* Messages */
.message {
    display: none;
    max-width: 90%;
    animation: messageBurst 1.2s ease forwards;
}

.message.show {
    display: block;
}

@keyframes messageBurst {
    0% {
        transform: scale(0) rotate(-8deg);
        opacity: 0;
    }

    50% {
        transform: scale(1.25) rotate(3deg);
        opacity: 1;
    }

    75% {
        transform: scale(0.92) rotate(-1deg);
    }

    100% {
        transform: scale(1) rotate(0);
        opacity: 1;
    }
}

h1 {
    font-size: clamp(30px, 7vw, 65px);
    margin-bottom: 20px;
    text-shadow:
        0 0 10px #fff,
        0 0 25px #ff5fa2,
        0 0 45px #ff5fa2;
}

p {
    font-size: clamp(17px, 4vw, 27px);
    line-height: 1.7;
    text-shadow: 0 0 12px rgba(255,255,255,0.8);
}

.goodbye {
    color: #ffd6ef;
    text-shadow:
        0 0 10px white,
        0 0 25px #ff69b4,
        0 0 40px #ff69b4;
}

/* 🎆 Burst particles */
.burst {
    position: fixed;
    left: 50%;
    top: 50%;
    pointer-events: none;
    z-index: 10;
}

.particle {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 10px white;
    animation: explode 1.2s ease-out forwards;
}

@keyframes explode {
    from {
        transform: translate(0,0) scale(1);
        opacity: 1;
    }

    to {
        transform:
            translate(
                calc((var(--x) - 50%) * 5px),
                calc((var(--y) - 50%) * 5px)
            )
            scale(0);
        opacity: 0;
    }
}

/* ❤️ floating hearts */
.heart {
    position: fixed;
    bottom: -20px;
    font-size: 22px;
    animation: floatUp 5s linear forwards;
    z-index: 3;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) scale(0.5);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform: translateY(-110vh) scale(1.5) rotate(30deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<!-- Moon -->
<div class="moon"></div>

<!-- Stars -->
<div id="stars"></div>

<div class="container">

    <!-- Countdown -->
    <div id="countdown" class="countdown">3</div>

    <!-- Birthday Message -->
    <div id="birthday" class="message">

        <h1>🎂 Happy Birthday Vikram 🎉</h1>

        <p>
            Wish you many more happy returns of the day. ✨
        </p>

        <p>
            Eppavuma happy-ah iru... ❤️
        </p>

        <p>
            Life-la nee ninaikkira ellame<br>
            success aaganum. 🌟
        </p>

        <br>

        <div class="goodbye">
            <p>🌙 Goodbye...</p>
            <p>Take care ❤️</p>
        </div>

    </div>

</div>

<script>

/* ⭐ Create stars */
const stars = document.getElementById("stars");

for (let i = 0; i < 90; i++) {

    const star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random() * 100 + "vw";
    star.style.top = Math.random() * 100 + "vh";

    star.style.animationDelay =
        Math.random() * 2 + "s";

    star.style.opacity =
        Math.random();

    stars.appendChild(star);
}


/* 🎆 Burst Effect */
function createBurst() {

    const burst = document.createElement("div");

    burst.className = "burst";

    for (let i = 0; i < 35; i++) {

        const particle = document.createElement("div");

        particle.className = "particle";

        particle.style.setProperty(
            "--x",
            Math.random() * 100 + "%"
        );

        particle.style.setProperty(
            "--y",
            Math.random() * 100 + "%"
        );

        particle.style.background =
            ["#ffffff", "#ffd700", "#ff69b4",
             "#7df9ff", "#b388ff"]
            [Math.floor(Math.random() * 5)];

        burst.appendChild(particle);
    }

    document.body.appendChild(burst);

    setTimeout(() => {
        burst.remove();
    }, 1500);
}


/* ❤️ Floating hearts */
function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.innerHTML =
        ["❤️", "💖", "✨", "💕", "🌟"]
        [Math.floor(Math.random() * 5)];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.animationDuration =
        (3 + Math.random() * 3) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}


/* ⏳ Countdown */
const countdown = document.getElementById("countdown");
const birthday = document.getElementById("birthday");

let number = 3;

const timer = setInterval(() => {

    number--;

    if (number > 0) {

        countdown.innerText = number;

        countdown.style.animation = "none";

        void countdown.offsetWidth;

        countdown.style.animation =
            "countdownPop 1s ease";

    } else {

        clearInterval(timer);

        countdown.style.display = "none";

        birthday.classList.add("show");

        /* 🎆 Big birthday burst */
        createBurst();

        /* ❤️ Hearts */
        setInterval(createHeart, 700);
    }

}, 1000);

</script>

</body>
</html>
