<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Vikram</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at center,#25284d,#101126 50%,#02030a);
    font-family:Georgia,serif;
    color:white;
}

/* Moon */

.moon{
    position:absolute;
    top:8%;
    right:10%;
    width:85px;
    height:85px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 25px #fff,0 0 70px rgba(255,255,255,.4);
}

/* Stars */

.star{
    position:absolute;
    color:white;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.2;transform:scale(.6)}
    to{opacity:1;transform:scale(1.3);text-shadow:0 0 12px white}
}

/* Countdown */

.countdown{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:130px;
    z-index:20;
    opacity:0;
    text-shadow:0 0 25px white,0 0 60px #fff;
}

.countdown.show{
    animation:count 1s ease forwards;
}

@keyframes count{
    0%{
        opacity:0;
        transform:scale(1.8);
    }
    25%{
        opacity:1;
        transform:scale(1);
    }
    75%{opacity:1}
    100%{
        opacity:0;
        transform:scale(.5);
    }
}

/* Birthday */

.message{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
    opacity:0;
    z-index:10;
}

.message.show{
    animation:appear 2s forwards;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message h1{
    font-size:42px;
    font-weight:400;
    margin-bottom:25px;
}

.message p{
    font-size:20px;
    line-height:1.9;
}

.line{
    width:180px;
    height:1px;
    background:#aaa;
    margin:20px auto;
}

/* Goodbye */

.goodbye{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    opacity:0;
    z-index:30;
}

.goodbye.show{
    animation:goodbye 2s forwards;
}

@keyframes goodbye{
    from{
        opacity:0;
        transform:scale(.85);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.goodbye h2{
    font-size:44px;
    font-weight:400;
}

.goodbye p{
    margin-top:20px;
    font-size:21px;
}

/* FIREWORK */

.firework{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:white;
    pointer-events:none;
    z-index:50;
    animation:explode 1.4s ease-out forwards;
}

@keyframes explode{

    0%{
        transform:translate(0,0) scale(1);
        opacity:1;
        box-shadow:0 0 10px white;
    }

    100%{
        transform:
            translate(
                calc(var(--x) * 1px),
                calc(var(--y) * 1px)
            )
            scale(.1);
        opacity:0;
    }
}

/* FIREWORK FLASH */

.flash{
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    background:rgba(255,255,255,.25);
    filter:blur(25px);
    pointer-events:none;
    z-index:40;
    animation:flash .5s forwards;
}

@keyframes flash{
    from{
        opacity:1;
        transform:scale(.2);
    }
    to{
        opacity:0;
        transform:scale(2);
    }
}

@media(max-width:600px){

    .countdown{
        font-size:90px;
    }

    .message h1{
        font-size:30px;
    }

    .message p{
        font-size:17px;
    }

    .goodbye h2{
        font-size:34px;
    }
}
</style>
</head>

<body>

<div class="moon"></div>

<div class="countdown" id="countdown"></div>

<div class="message" id="message">

    <div>

        <h1>Happy Birthday Vikram 🎂</h1>

        <div class="line"></div>

        <p>
            Wish you many more happy returns of the day.
            <br><br>

            Eppavuma happy-ah iru... ❤️
            <br>

            Life-la nee ninaikkira ellame
            <br>

            success aaganum. ✨
        </p>

    </div>

</div>

<div class="goodbye" id="goodbye">

    <div>

        <h2>Goodbye... 🌙</h2>

        <p>Take care ❤️</p>

    </div>

</div>


<script>

/* STARS */

for(let i=0;i<90;i++){

    let star=document.createElement("div");

    star.className="star";
    star.innerHTML="✦";

    star.style.left=Math.random()*100+"vw";
    star.style.top=Math.random()*100+"vh";

    star.style.fontSize=
        (4+Math.random()*9)+"px";

    star.style.animationDelay=
        Math.random()*3+"s";

    document.body.appendChild(star);
}


/* FIREWORK */

function firework(x,y){

    /* Flash */

    let flash=document.createElement("div");

    flash.className="flash";

    flash.style.left=(x-90)+"px";
    flash.style.top=(y-90)+"px";

    document.body.appendChild(flash);

    setTimeout(()=>{
        flash.remove();
    },600);


    /* Particles */

    for(let i=0;i<45;i++){

        let particle=document.createElement("div");

        particle.className="firework";

        particle.style.left=x+"px";
        particle.style.top=y+"px";

        let angle=
            Math.random()*Math.PI*2;

        let distance=
            80+Math.random()*180;

        particle.style.setProperty(
            "--x",
            Math.cos(angle)*distance
        );

        particle.style.setProperty(
            "--y",
            Math.sin(angle)*distance
        );

        document.body.appendChild(particle);

        setTimeout(()=>{
            particle.remove();
        },1500);
    }
}


/* MULTIPLE FIREWORKS */

function fireworks(){

    firework(
        window.innerWidth*.25,
        window.innerHeight*.35
    );

    setTimeout(()=>{
        firework(
            window.innerWidth*.75,
            window.innerHeight*.30
        );
    },250);

    setTimeout(()=>{
        firework(
            window.innerWidth*.5,
            window.innerHeight*.25
        );
    },500);
}


/* COUNTDOWN */

const countdown=
document.getElementById("countdown");

const message=
document.getElementById("message");

const goodbye=
document.getElementById("goodbye");

const numbers=["3","2","1"];

let i=0;


function count(){

    if(i<numbers.length){

        countdown.innerText=numbers[i];

        countdown.classList.remove("show");

        void countdown.offsetWidth;

        countdown.classList.add("show");

        i++;

        setTimeout(count,1000);

    }else{

        /* BIG FIREWORK */

        setTimeout(()=>{
            fireworks();
        },200);

        /* Birthday */

        setTimeout(()=>{
            message.classList.add("show");
        },700);


        /* Goodbye after birthday */

        setTimeout(()=>{

            message.style.opacity="0";

            fireworks();

        },6500);


        setTimeout(()=>{

            goodbye.classList.add("show");

        },7200);


        /* Final fireworks */

        setTimeout(()=>{
            fireworks();
        },8500);
    }
}

setTimeout(count,800);

</script>

</body>
</html>
