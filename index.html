<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Vikram 🎂</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 20%, #202a63 0%, #0b102c 45%, #02030d 100%);
    color: white;
    font-family: Arial, sans-serif;
}

/* =========================
   🌙 MOON
========================= */

.moon {
    position: fixed;
    top: 8%;
    right: 10%;
    width: 90px;
    height: 90px;
    background: #fff8c9;
    border-radius: 50%;
    box-shadow:
        0 0 20px #fff8c9,
        0 0 50px rgba(255, 248, 201, 0.6);
    z-index: 1;
}

.moon::after {
    content: "";
    position: absolute;
    width: 90px;
    height: 90px;
    top: -8px;
    left: 25px;
    border-radius: 50%;
    background: #090d27;
}


/* =========================
   ⭐ STARS
========================= */

.star {
    position: fixed;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 8px white;
    animation: twinkle 2s infinite alternate;
    z-index: 0;
}

@keyframes twinkle {

    0% {
        opacity: 0.2;
        transform: scale(0.5);
    }

    100% {
        opacity: 1;
        transform: scale(1.5);
    }
}


/* =========================
   MAIN AREA
========================= */

.container {
    width: 100%;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    position: relative;
    z-index: 5;
}


/* =========================
   COUNTDOWN
========================= */

#countdown {
    font-size: 100px;
    font-weight: bold;

    text-shadow:
        0 0 10px white,
        0 0 30px #8ab4ff,
        0 0 60px #8ab4ff;

    animation: countdownPop 1s ease;
}

@keyframes countdownPop {

    0% {
        transform: scale(0);
        opacity: 0;
    }

    50% {
        transform: scale(1.4);
        opacity: 1;
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}


/* =========================
   BIRTHDAY MESSAGE
========================= */

.message {
    display: none;
    width: 90%;
    max-width: 850px;
}

.message.show {
    display: block;
    animation: messageBurst 1.5s ease forwards;
}

@keyframes messageBurst {

    0% {
        transform: scale(0);
        opacity: 0;
    }

    40% {
        transform: scale(1.25);
        opacity: 1;
    }

    70% {
        transform: scale(0.92);
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}


/* =========================
   BIRTHDAY TITLE
========================= */

h1 {
    font-size: clamp(32px, 7vw, 65px);

    margin-bottom: 20px;

    text-shadow:
        0 0 10px white,
        0 0 25px #ff70b7,
        0 0 50px #ff70b7;
}


/* =========================
   TEXT
========================= */

p {
    font-size: clamp(17px, 3vw, 27px);

    line-height: 1.8;

    text-shadow:
        0 0 10px rgba(255,255,255,0.8);
}


/* =========================
   GOODBYE
========================= */

.goodbye {
    margin-top: 15px;

    animation:
        goodbyePop 1.5s ease 4s both;
}

.goodbye p:first-child {
    color: #e8e8ff;
    font-size: clamp(25px, 5vw, 42px);

    text-shadow:
        0 0 10px white,
        0 0 30px #8fa8ff;
}

.goodbye p:last-child {
    color: #ffd7ec;

    text-shadow:
        0 0 10px white,
        0 0 25px #ff69b4;
}

@keyframes goodbyePop {

    0% {
        transform: scale(0);
        opacity: 0;
    }

    60% {
        transform: scale(1.25);
        opacity: 1;
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}


/* =========================
   🎆 BURST
========================= */

.burst {
    position: fixed;

    left: 50%;
    top: 50%;

    width: 10px;
    height: 10px;

    pointer-events: none;

    z-index: 20;
}

.particle {
    position: absolute;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 10px white,
        0 0 20px white;

    animation: explode 1.4s ease-out forwards;
}

@keyframes explode {

    0% {
        transform:
            translate(0, 0)
            scale(1);

        opacity: 1;
    }

    100% {
        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(0);

        opacity: 0;
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .moon {
        width: 60px;
        height: 60px;
        right: 8%;
    }

    .moon::after {
        width: 60px;
        height: 60px;
        left: 17px;
    }

    #countdown {
        font-size: 80px;
    }

}
</style>
</head>


<body>

<!-- 🌙 Moon -->
<div class="moon"></div>

<!-- ⭐ Stars -->
<div id="stars"></div>


<div class="container">

    <!-- ⏳ Countdown -->
    <div id="countdown">3</div>


    <!-- 🎂 Birthday Message -->
    <div id="birthdayMessage" class="message">

        <h1>
            🎂 Happy Birthday Vikram 🎉
        </h1>

        <p>
            Wish you many more happy returns of the day.
        </p>

        <p>
            Eppavuma happy-ah iru...
        </p>

        <p>
            Life-la nee ninaikkira ellame<br>
            success aaganum.
        </p>


        <!-- 🌙 Last message -->
        <div class="goodbye">

            <p>
                🌙 Goodbye...
            </p>

            <p>
                Take care ❤️
            </p>

        </div>

    </div>

</div>


<script>

/* =========================
   ⭐ CREATE STARS
========================= */

const starsContainer =
    document.getElementById("stars");

for (let i = 0; i < 100; i++) {

    const star =
        document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "vw";

    star.style.top =
        Math.random() * 100 + "vh";

    star.style.animationDelay =
        Math.random() * 2 + "s";

    starsContainer.appendChild(star);
}


/* =========================
   🎆 BURST EFFECT
========================= */

function createBurst() {

    const burst =
        document.createElement("div");

    burst.className = "burst";

    const colors = [
        "#ffffff",
        "#ffd700",
        "#ff69b4",
        "#7df9ff",
        "#b388ff"
    ];

    for (let i = 0; i < 60; i++) {

        const particle =
            document.createElement("div");

        particle.className = "particle";

        const angle =
            Math.random() * Math.PI * 2;

        const distance =
            100 + Math.random() * 300;

        const x =
            Math.cos(angle) * distance;

        const y =
            Math.sin(angle) * distance;

        particle.style.setProperty(
            "--x",
            x + "px"
        );

        particle.style.setProperty(
            "--y",
            y + "px"
        );

        particle.style.background =
            colors[
                Math.floor(
                    Math.random() * colors.length
                )
            ];

        burst.appendChild(particle);
    }

    document.body.appendChild(burst);

    setTimeout(() => {
        burst.remove();
    }, 1600);
}


/* =========================
   ⏳ COUNTDOWN
========================= */

const countdown =
    document.getElementById("countdown");

const birthdayMessage =
    document.getElementById("birthdayMessage");

let number = 3;


/* 3 → 2 → 1 */

const countdownTimer =
    setInterval(() => {

        number--;

        if (number > 0) {

            countdown.innerText =
                number;

            countdown.style.animation =
                "none";

            void countdown.offsetWidth;

            countdown.style.animation =
                "countdownPop 1s ease";

        }

        else {

            clearInterval(
                countdownTimer
            );

            /* Hide countdown */
            countdown.style.display =
                "none";

            /* Show birthday message */
            birthdayMessage.classList.add(
                "show"
            );

            /* 🎆 Big burst */
            createBurst();

            /* Another burst */
            setTimeout(() => {
                createBurst();
            }, 700);

        }

    }, 1000);

</script>

</body>
</html>
