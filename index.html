<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Vikram</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;

    background:
        radial-gradient(circle at center,
        #303030 0%,
        #171717 45%,
        #050505 100%);

    color:white;
}

/* Background glow */

.bg{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;

    background:rgba(255,255,255,0.04);

    filter:blur(70px);

    animation:bgMove 5s ease-in-out infinite alternate;
}

@keyframes bgMove{
    from{
        transform:scale(.8);
        opacity:.3;
    }

    to{
        transform:scale(1.3);
        opacity:.7;
    }
}


/* COUNTDOWN */

.countdown{
    position:absolute;
    z-index:5;

    font-size:130px;
    font-weight:300;

    letter-spacing:10px;

    opacity:0;

    text-shadow:
        0 0 20px rgba(255,255,255,.4),
        0 0 60px rgba(255,255,255,.15);
}

.countdown.show{
    animation:numberShow 1s ease forwards;
}

@keyframes numberShow{

    0%{
        opacity:0;
        transform:scale(1.8);
    }

    25%{
        opacity:1;
        transform:scale(1);
    }

    75%{
        opacity:1;
        transform:scale(1);
    }

    100%{
        opacity:0;
        transform:scale(.6);
    }
}


/* FINAL MESSAGE */

.message{
    position:relative;
    z-index:10;

    text-align:center;

    opacity:0;
    transform:translateY(25px);

    pointer-events:none;
}

.message.show{
    animation:messageIn 2s ease forwards;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message h1{
    font-size:42px;
    font-weight:500;

    margin-bottom:25px;

    letter-spacing:1px;
}

.message p{
    font-size:20px;
    line-height:1.8;

    color:#dddddd;
}

.highlight{
    color:white;
    font-weight:bold;
}

.line{
    width:0;
    height:1px;

    background:#777;

    margin:25px auto;

    animation:line 1.5s 1s forwards;
}

@keyframes line{
    to{
        width:180px;
    }
}

.final{
    margin-top:25px;

    font-size:18px;
    letter-spacing:2px;

    color:#aaa;
}


/* MOBILE */

@media(max-width:600px){

    .countdown{
        font-size:90px;
    }

    .message{
        padding:25px;
    }

    .message h1{
        font-size:30px;
    }

    .message p{
        font-size:17px;
    }
}
</style>
</head>


<body>

<div class="bg"></div>

<!-- COUNTDOWN -->

<div class="countdown" id="countdown"></div>


<!-- BIRTHDAY MESSAGE -->

<div class="message" id="message">

    <h1>
        Happy Birthday Vikram 🎂
    </h1>

    <div class="line"></div>

    <p>

        Wish you many more happy returns of the day.

        <br><br>

        <span class="highlight">
            Eppavuma happy-ah iru...
        </span>

        <br>

        Life-la nee ninaikkira ellame

        <br>

        <span class="highlight">
            success aaganum.
        </span>

    </p>

    <div class="final">
        GB TC
    </div>

</div>


<script>

const countdown =
document.getElementById("countdown");

const message =
document.getElementById("message");

let numbers = ["3","2","1"];

let index = 0;


/* Show each number */

function showNumber(){

    if(index < numbers.length){

        countdown.innerText =
            numbers[index];

        countdown.classList.remove("show");

        /* restart animation */
        void countdown.offsetWidth;

        countdown.classList.add("show");

        index++;

        setTimeout(showNumber,1000);

    }else{

        /* After 3 2 1 */

        setTimeout(()=>{

            message.classList.add("show");

        },300);

    }
}


/* Start */

setTimeout(showNumber,500);

</script>

</body>
</html>
