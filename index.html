<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goodbye Vikram</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 50% 45%,
        #25284d 0%,
        #101126 45%,
        #03040b 100%);
    font-family:Georgia,serif;
    color:white;
}

/* Moon */

.moon{
    position:absolute;
    top:10%;
    right:12%;
    width:90px;
    height:90px;
    border-radius:50%;
    background:#fff;
    box-shadow:
        0 0 20px #fff,
        0 0 60px rgba(255,255,255,.4);
}

/* Stars */

.star{
    position:absolute;
    color:white;
    font-size:10px;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.2;
        transform:scale(.6);
    }
    to{
        opacity:1;
        transform:scale(1.3);
        text-shadow:0 0 12px white;
    }
}

/* Main */

.content{
    text-align:center;
    z-index:5;
    animation:fadeIn 2s ease forwards;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    font-size:48px;
    font-weight:400;
    letter-spacing:2px;
    text-shadow:
        0 0 15px rgba(255,255,255,.5);
}

p{
    margin-top:20px;
    font-size:20px;
    color:#ddd;
    letter-spacing:1px;
}

.small{
    margin-top:30px;
    font-size:16px;
    color:#aaa;
}

/* Pop particles */

.pop{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:white;
    animation:pop 3s ease-out forwards;
}

@keyframes pop{
    0%{
        transform:translate(0,0) scale(0);
        opacity:1;
    }

    30%{
        opacity:1;
    }

    100%{
        transform:
            translate(
                calc((var(--x)) * 1px),
                calc((var(--y)) * 1px)
            )
            scale(.2);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="moon"></div>

<div class="content">

    <h1>Goodbye, Vikram 🌙</h1>

    <p>
        Take care of yourself...
        <br>
        Keep smiling & stay happy always. ✨
    </p>

    <div class="small">
        GB TC ❤️
    </div>

</div>

<script>

/* Stars */

for(let i=0;i<80;i++){

    const star=document.createElement("div");

    star.className="star";
    star.innerHTML="✦";

    star.style.left=Math.random()*100+"vw";
    star.style.top=Math.random()*100+"vh";

    star.style.fontSize=
        (4+Math.random()*9)+"px";

    star.style.animationDelay=
        Math.random()*3+"s";

    document.body.appendChild(star);
}


/* Pop particles */

function createPop(){

    const pop=document.createElement("div");

    pop.className="pop";

    pop.style.left="50vw";
    pop.style.top="50vh";

    pop.style.setProperty(
        "--x",
        (Math.random()*500-250)
    );

    pop.style.setProperty(
        "--y",
        (Math.random()*500-250)
    );

    document.body.appendChild(pop);

    setTimeout(()=>{
        pop.remove();
    },3000);
}

setInterval(createPop,100);

</script>

</body>
</html>
