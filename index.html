<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Vikram ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at center,
        #25284d 0%,
        #101126 45%,
        #02030a 100%);
    font-family:Georgia,serif;
    color:white;
}

/* ---------- MOON ---------- */

.moon{
    position:absolute;
    top:8%;
    right:10%;
    width:85px;
    height:85px;
    border-radius:50%;
    background:#fff;

    box-shadow:
        0 0 20px #fff,
        0 0 60px rgba(255,255,255,.45);

    opacity:.9;
}

/* ---------- STARS ---------- */

.star{
    position:absolute;
    color:white;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.15;
        transform:scale(.6);
    }

    to{
        opacity:1;
        transform:scale(1.3);
        text-shadow:0 0 12px white;
    }
}

/* ---------- COUNTDOWN ---------- */

.countdown{
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:130px;
    font-weight:300;

    opacity:0;

    z-index:10;

    text-shadow:
        0 0 20px white,
        0 0 60px rgba(255,255,255,.3);
}

.countdown.show{
    animation:count 1s ease forwards;
}

@keyframes count{

    0%{
        opacity:0;
        transform:scale(1.8);
    }

    25%{
        opacity:1;
        transform:scale(1);
    }

    70%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:scale(.5);
    }
}

/* ---------- MESSAGE ---------- */

.message{
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:25px;

    opacity:0;
    z-index:5;
}

.message.show{
    animation:messageIn 2s ease forwards;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message h1{
    font-size:42px;
    font-weight:400;
    margin-bottom:25px;

    text-shadow:
        0 0 15px rgba(255,255,255,.5);
}

.message p{
    font-size:20px;
    line-height:1.9;
    color:#eee;
}

.highlight{
    color:#fff;
    font-weight:bold;
}

.line{
    width:0;
    height:1px;
    background:#aaa;
    margin:25px auto;

    animation:lineGrow 1.5s 1s forwards;
}

@keyframes lineGrow{
    to{
        width:180px;
    }
}

/* ---------- GOODBYE ---------- */

.goodbye{
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    opacity:0;
    z-index:20;

    pointer-events:none;
}

.goodbye.show{
    animation:goodbyeIn 2.5s ease forwards;
}

@keyframes goodbyeIn{

    0%{
        opacity:0;
        transform:scale(.85);
    }

    50%{
        opacity:1;
        transform:scale(1.03);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }
}

.goodbye h2{
    font-size:42px;
    font-weight:400;

    text-shadow:
        0 0 15px white,
        0 0 40px rgba(255,255,255,.3);
}

.goodbye p{
    margin-top:20px;
    font-size:19px;
    color:#ddd;
}

.signature{
    margin-top:30px;
    font-size:16px;
    letter-spacing:4px;
    color:#aaa;
}

/* ---------- POP PARTICLES ---------- */

.pop{
    position:absolute;

    width:6px;
    height:6px;

    border-radius:50%;

    background:white;

    pointer-events:none;

    z-index:2;

    animation:pop 2.5s ease-out forwards;
}

@keyframes pop{

    0%{
        transform:
            translate(0,0)
            scale(0);

        opacity:1;
    }

    20%{
        transform:
            translate(
                calc(var(--x) * .3px),
                calc(var(--y) * .3px)
            )
            scale(1);
    }

    100%{
        transform:
            translate(
                calc(var(--x) * 1px),
                calc(var(--y) * 1px)
            )
            scale(.1);

        opacity:0;
    }
}

/* MOBILE */

@media(max-width:600px){

    .countdown{
        font-size:90px;
    }

    .message h1{
        font-size:30px;
    }

    .message p{
        font-size:17px;
    }

    .goodbye h2{
        font-size:32px;
    }

    .moon{
        width:60px;
        height:60px;
    }
}
</style>
</head>

<body>

<!-- MOON -->
<div class="moon"></div>

<!-- COUNTDOWN -->
<div class="countdown" id="countdown"></div>


<!-- BIRTHDAY MESSAGE -->
<div class="message" id="message">

    <div>

        <h1>
            Happy Birthday Vikram 🎂
        </h1>

        <div class="line"></div>

        <p>

            <b>Wish you many more happy returns of the day.</b>

            <br><br>

            <span class="highlight">
                Eppavuma happy-ah iru...
            </span>

            <br>

            <span class="highlight">
                Life-la nee ninaikkira ellame success aaganum.
            </span>

        </p>

    </div>

</div>


<!-- GOODBYE -->
<div class="goodbye" id="goodbye">

    <div>

        <h2>
            Goodbye... 🌙
        </h2>

        <p>
            Take care ❤️
        </p>

        <div class="signature">
            GB TC
        </div>

    </div>

</div>


<script>

/* ---------- CREATE STARS ---------- */

for(let i=0;i<90;i++){

    const star=document.createElement("div");

    star.className="star";

    star.innerHTML="✦";

    star.style.left=
        Math.random()*100+"vw";

    star.style.top=
        Math.random()*100+"vh";

    star.style.fontSize=
        (4+Math.random()*9)+"px";

    star.style.animationDelay=
        Math.random()*3+"s";

    document.body.appendChild(star);
}


/* ---------- POP EFFECT ---------- */

function createPop(){

    const pop=document.createElement("div");

    pop.className="pop";

    pop.style.left="50vw";
    pop.style.top="50vh";

    pop.style.setProperty(
        "--x",
        Math.random()*600-300
    );

    pop.style.setProperty(
        "--y",
        Math.random()*600-300
    );

    document.body.appendChild(pop);

    setTimeout(()=>{
        pop.remove();
    },2500);
}


/* ---------- COUNTDOWN ---------- */

const countdown=
document.getElementById("countdown");

const message=
document.getElementById("message");

const goodbye=
document.getElementById("goodbye");

const numbers=["3","2","1"];

let index=0;


function showCountdown(){

    if(index < numbers.length){

        countdown.innerText=
            numbers[index];

        countdown.classList.remove("show");

        /* Restart animation */
        void countdown.offsetWidth;

        countdown.classList.add("show");

        /* Small pop when number appears */
        for(let i=0;i<10;i++){
            setTimeout(createPop,i*30);
        }

        index++;

        setTimeout(
            showCountdown,
            1000
        );

    }else{

        /* Show birthday message */

        setTimeout(()=>{

            message.classList.add("show");

        },300);


        /* Hide birthday after 6 seconds */

        setTimeout(()=>{

            message.style.animation=
                "fadeOut 1.5s forwards";

        },6500);


        /* Goodbye */

        setTimeout(()=>{

            goodbye.classList.add("show");

            for(let i=0;i<40;i++){
                setTimeout(
                    createPop,
                    i*40
                );
            }

        },8000);
    }
}


/* START */

setTimeout(
    showCountdown,
    800
);

</script>

</body>
</html>
